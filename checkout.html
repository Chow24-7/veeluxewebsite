  <!-- Google Fonts: Inter -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="shortcut icon" href="logo.png" type="image/png">
  <!-- Your Custom CSS -->
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- NAVBAR -->
  <nav class="navbar navbar-expand-lg navbar-light bg-white px-4 py-2 shadow-sm">
    <div class="container-fluid">
      <a class="navbar-brand" href="index.html"><img src="images/logowb.png" alt="logo" class="logo-image"/></a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto mb-2 mb-lg-0 align-items-center">
          <li class="nav-item"><a class="nav-link" href="index.html#about">About</a></li>

          <li class="nav-item"><a class="nav-link" href="index.html#reviews">Reviews</a></li>
          <li class="nav-item"><a class="nav-link" href="index.html#contact">Contact</a></li>
          <li class="nav-item position-relative">
            <a class="nav-link cart-icon" href="cart.html">
              <i class="ri-shopping-cart-2-line fs-4"></i>
              <span class="cart-count badge rounded-pill bg-danger">0</span>
            </a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- CHECKOUT SECTION -->
  <section class="checkout-section py-5">
    <div class="container">
      <h2 class="text-center mb-4">Checkout</h2>
      
      <div class="row">
        <!-- Order Summary -->
        <div class="col-lg-4 order-lg-2 mb-4">
          <div class="card">
            <div class="card-header bg-light">
              <h5 class="mb-0">Order Summary</h5>
            </div>
            <div class="card-body">
              <div id="checkout-items">
                <!-- Items will be populated by JavaScript -->
              </div>
              <hr>
              <div class="d-flex justify-content-between mb-2">
                <span>Subtotal:</span>
                <span id="checkout-subtotal">₦0</span>
              </div>
              <div class="d-flex justify-content-between mb-2">
                <span>Shipping:</span>
                <span id="checkout-shipping">₦0</span>
              </div>
              <div class="d-flex justify-content-between fw-bold">
                <span>Total:</span>
                <span id="checkout-total">₦0</span>
              </div>
            </div>
          </div>
        </div>
        
        <!-- Checkout Form -->
        <div class="col-lg-8 order-lg-1">
          <div class="card mb-4">
            <div class="card-header bg-light">
              <h5 class="mb-0">Billing Details</h5>
            </div>
            <div class="card-body">
              <form id="checkout-form">
                <div class="row g-3">
                  <div class="col-md-6">
                    <label for="firstName" class="form-label">First Name</label>
                    <input type="text" class="form-control" id="firstName" required>
                  </div>
                  <div class="col-md-6">
                    <label for="lastName" class="form-label">Last Name</label>
                    <input type="text" class="form-control" id="lastName" required>
                  </div>
                  <div class="col-12">
                    <label for="email" class="form-label">Email</label>
                    <input type="email" class="form-control" id="email" required>
                  </div>
                  <div class="col-12">
                    <label for="phone" class="form-label">Phone Number</label>
                    <input type="tel" class="form-control" id="phone" required>
                  </div>
                </div>
                
                <hr class="my-4">
                
                <h5 class="mb-3">Payment Method</h5>
                <div class="form-check mb-3">
                  <input class="form-check-input" type="radio" name="paymentMethod" id="paystack" checked>
                  <label class="form-check-label" for="paystack">
                    Pay with Card (Paystack)
                  </label>
                </div>
                
                <div class="d-grid gap-2">
                  <button type="button" id="paystack-button" class="btn btn-primary btn-lg">Proceed to Payment</button>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- FOOTER -->
  <footer class="footer-custom text-white">
    <div class="container">
      <!-- Flex wrapper for three columns -->
      <div class="d-flex flex-column flex-md-row justify-content-between align-items-center gap-5">
        
        <!-- Socials -->
        <div class="footer-col">
          <h5 class="mb-3">Follow Us</h5>
          <div class="footer-socials">
            <a href="https://www.instagram.com/__veeluxe?igsh=eTBpeG0zaTZ4YWlk&utm_source=qr" class="text-white text-decoration-none"><i class="ri-instagram-line ri-2x"></i></a>
            <a href="https://wa.me/2347014888211" class="text-white text-decoration-none"><i class="ri-whatsapp-line ri-2x"></i></a>
            <a href="https://www.tiktok.com/@__veeluxe?_t=ZM-8xfc4k64Snu&_r=1" class="text-white text-decoration-none"><i class="ri-tiktok-line ri-2x"></i></a>
            <a href="https://snapchat.com/t/N6BmtcWx" class="text-white text-decoration-none"><i class="ri-snapchat-line ri-2x"></i></a>
          </div>
        </div>
        <!-- Contact Form -->
        <div class="footer-col" id="contact">
          <h5 class="mb-3">Contact Us</h5>
          <form>
            <input type="text" class="form-control" placeholder="Your Name" required>
            <input type="email" class="form-control" placeholder="Your Email" required>
            <textarea class="form-control" rows="2" placeholder="Message" required></textarea>
            <button type="submit" class="btn btn-primary w-100 mt-2">Send</button>
          </form>
        </div>
        <!-- Navigation Links -->
        <div class="footer-col">
          <h5 class="mb-3">Navigate</h5>
          <ul class="list-unstyled">
            <li><a href="index.html" class="text-white text-decoration-none">Home</a></li>
            <li><a href="about.html" class="text-white text-decoration-none">About</a></li>
            <li><a href="index.html#reviews" class="text-white text-decoration-none">Reviews</a></li>
            <li><a href="index.html#contact" class="text-white text-decoration-none">Contact</a></li>
            <li class="nav-item">
              <a class="nav-link position-relative cart-icon" href="cart.html">
                <i class="ri-shopping-cart-2-line fs-4"></i>
                <span class="cart-count badge rounded-pill bg-danger">0</span>
              </a>
            </li>
          </ul>
        </div>
      </div>
      <!-- Footer bottom -->
      <div class="footer-bottom mt-4 pt-3 border-top border-light-subtle text-center" style="font-size: 0.875rem; color: #aaa;">
        &copy; 2025 Veeluxe. All rights reserved.
      </div>
    </div>
  </footer>
  <button class="back-to-top" aria-label="Back to top">↑</button>
  
  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Paystack JS -->
  <script src="https://js.paystack.co/v1/inline.js"></script>
  <!-- Custom JS -->
  <script src="script.js"></script>
  <script src="checkout.js"></script>
</body>
</html>
